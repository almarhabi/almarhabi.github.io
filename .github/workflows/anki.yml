# 🃏 Builds the ANKI decks the study site asks for (index.html → 🃏 ANKI).
# The site puts the cards Kimi wrote in the `anki-jobs` branch (in/<id>.json) and sends a repository_dispatch;
# this turns every waiting job into out/<id>.apkg with tools/anki/build_apkg.py and saves it back to that branch.
# GitHub Pages is not touched (it serves main only).
name: anki

on:
  repository_dispatch:
    types: [anki]
  workflow_dispatch:

permissions:
  contents: write

# one run at a time; each run builds every job that is waiting, so a run GitHub drops from the queue loses nothing
concurrency:
  group: anki-jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Builder (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: site
          sparse-checkout: |
            tools/anki
            .github/scripts
          persist-credentials: false

      - name: Jobs (anki-jobs)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: anki-jobs
          path: jobs

      - name: Build every waiting job
        run: python3 site/tools/anki/job.py jobs "$RUNNER_TEMP/done.txt"

      # the branch is kept as ONE commit (no history): old decks really leave it, and it never grows.
      # A job the site sent while this ran is carried over; --force-with-lease never drops one that lands meanwhile.
      - name: Save the decks
        working-directory: jobs
        run: bash ../site/.github/scripts/save-anki.sh "$RUNNER_TEMP/done.txt"

      # An unprocessed backlog or a job that arrived during the build needs another run, even if no device sends a new event.
      - name: Continue the backlog
        working-directory: jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if find in -regextype posix-extended -maxdepth 1 -type f -regex 'in/[a-z0-9]{8,40}\.json' -print -quit | grep -q .; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=anki
          fi
