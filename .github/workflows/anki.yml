# 🃏 Builds the ANKI decks the study site asks for (index.html → 🃏 ANKI).
# The site puts the cards Kimi wrote in the `anki-jobs` branch (in/<id>.json) and sends a repository_dispatch;
# this turns every waiting job into out/<id>.apkg with tools/anki/build_apkg.py and saves it back to that branch.
# GitHub Pages is not touched (it serves main only).
name: anki

on:
  repository_dispatch:
    types: [anki]
  workflow_dispatch:

permissions:
  contents: write

# one run at a time; each run builds every job that is waiting, so a run GitHub drops from the queue loses nothing
concurrency:
  group: anki-jobs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Builder (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          sparse-checkout: tools/anki
          persist-credentials: false

      - name: Jobs (anki-jobs)
        uses: actions/checkout@v4
        with:
          ref: anki-jobs
          path: jobs

      - name: Build every waiting job
        run: python3 site/tools/anki/job.py jobs

      - name: Save the decks
        working-directory: jobs
        run: |
          git config user.name "anki-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "anki: build decks"
          for i in 1 2 3 4 5; do
            if git push -q origin HEAD:anki-jobs; then exit 0; fi
            sleep $((i * 2))
            git pull -q --rebase origin anki-jobs
          done
          exit 1
