name: Production checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_PATH: ${{ github.workspace }}/tools/runner/node_modules
      CHROMIUM_PATH: /usr/bin/google-chrome
      AXE_MODULE: ${{ github.workspace }}/tools/audit/node_modules/axe-core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tools/runner/package-lock.json
            tools/audit/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/anki/requirements-test.txt
      - name: Reproducible dependencies
        run: |
          npm ci --prefix tools/runner --ignore-scripts --no-fund
          npm ci --prefix tools/audit --ignore-scripts --no-fund
          python3 -m pip install --disable-pip-version-check --upgrade pip==26.2.2
          python3 -m pip install --disable-pip-version-check --requirement tools/anki/requirements-test.txt
      - name: Dependency vulnerabilities
        run: |
          npm audit --prefix tools/runner --audit-level=moderate
          npm audit --prefix tools/audit --audit-level=moderate
      - name: Production CSP, all-source syntax and correctness lint
        run: |
          node tools/audit/validate.cjs
          python3 - <<'PY'
          import pathlib, py_compile, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z', '--cached', '--others', '--exclude-standard']).decode().split('\0')
          javascript = python = 0
          for filename in sorted(set(filter(None, files))):
              source = pathlib.Path(filename)
              if source.suffix in ('.js', '.cjs', '.mjs'):
                  subprocess.run(['node', '--check', str(source)], check=True)
                  javascript += 1
              elif source.suffix == '.py':
                  py_compile.compile(str(source), doraise=True)
                  python += 1
          print(f'PASS syntax: {javascript} JavaScript and {python} Python source files')
          PY
          bash -n .github/scripts/save-anki.sh
      - name: Python backend dependency and real Anki import/reimport checks
        run: |
          python3 -m pip check
          python3 -c "from importlib.metadata import version; from anki.collection import Collection; assert version('pip') == '26.2.2'; assert version('anki') == '25.9.5'; print('Pinned pip and official Anki 25.9.5 backend are installed')"
          python3 -m unittest discover -s tools/anki -p 'test_*.py'
      - name: Logic, cancellation and state regression checks
        run: |
          node tools/anki/test_objectives.js
          node tools/audit/ai-regressions.js
          node tools/audit/ai-concurrency.cjs
          node tools/audit/ai-boundaries.cjs
          node tools/audit/ai-loader.cjs
          node tools/audit/integration-regressions.cjs
          node tools/audit/state-regressions.cjs
          node tools/audit/state-queue.cjs
          node tools/audit/state-errors.cjs
          node tools/audit/state-clock.cjs
          node tools/audit/state-fuzz.cjs
      - name: Runner lifecycle, streaming proxy and concurrent job persistence
        run: node --test tools/runner/test_runner.mjs tools/runner/test_anki_save.mjs
      - name: Security checks
        run: |
          python3 tools/audit/security-scan.py
          node tools/audit/security-worker.test.cjs
          node tools/audit/security-bridge.test.cjs
          node tools/audit/security-gas-client.test.cjs
          node tools/audit/security-firebase-config.cjs
          node tools/audit/security-repros.js --assert-secure
      - name: Browser user journeys and responsive layouts
        run: |
          node tools/anki/test_browser.js
          node tools/audit/state-browser.cjs
          node tools/audit/state-wipe.cjs
          node tools/audit/state-clock-browser.cjs
          node tools/audit/ai-tabs.cjs
          node tools/audit/frontend.cjs
          node tools/audit/frontend_media.cjs
      - name: Real pinned CDN libraries and PDF workers under production CSP
        env:
          AI_CDN_CACHE: ${{ runner.temp }}/uqu-cdn-audit
        run: |
          python3 tools/audit/cache-cdn.py
          node tools/audit/ai-libraries.cjs
      - name: Accessibility scans of all pages and the modal
        run: node tools/audit/frontend_accessibility.cjs

  browser-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      NODE_PATH: ${{ github.workspace }}/tools/runner/node_modules
      AUDIT_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/runner --ignore-scripts --no-audit --no-fund
      - name: Install the tested browser engine and its system libraries
        run: node tools/runner/node_modules/playwright-core/cli.js install --with-deps ${{ matrix.browser }}
      - run: node tools/audit/frontend.cjs

  firebase-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      FIREBASE_CLI_DISABLE_TELEMETRY: '1'
      GCLOUD_PROJECT: demo-uqu-audit
      GOOGLE_CLOUD_PROJECT: demo-uqu-audit
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the browser harness and verify public SDK fixture bytes
        env:
          AI_CDN_CACHE: ${{ runner.temp }}/uqu-cdn-audit
        run: |
          npm ci --prefix tools/runner --ignore-scripts --no-audit --no-fund
          python3 tools/audit/cache-cdn.py
      - name: Test authorization, real SDK epochs and long-poll CSP using the SHA256-pinned emulator
        env:
          AI_CDN_CACHE: ${{ runner.temp }}/uqu-cdn-audit
        run: python3 tools/audit/run-firebase.py
